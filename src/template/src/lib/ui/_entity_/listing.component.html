<page-title [title]="'_PEntity_'"></page-title>
<page-actions
  (delete)="onDelete()"
  (searchChange)="onSearch($event)"
  (dateRangeChange)="onDateChange($event)"
  (create)="showChildComponent(childComponents.createForm, 'createForm')"
  [disabled]="{
    delete: selected.length !== 1
  }"
></page-actions>
<app-offcanvas
  id="_entity_-forms"
  [title]="childComponentSelected && childComponentSelected?.title"
  [visible]="childSelected"
  (visibleChange)="hideChildComponent($event)"
>
  <_section_-create-_entity_-form
     *ngIf="selectedChildKey === 'createForm'"
    (created)="onCreated()"
  ></_section_-create-_entity_-form>
  <_section_-edit-_entity_-form
     *ngIf="selectedChildKey === 'editForm'"
  ></_section_-edit-_entity_-form>
</app-offcanvas>

<div class="main-content dt" #dtContainer>
  <div class="row">
    <div class="col-md-12 my-2">
      <span class="float-end">Total: {{ sb._entityName_.pagination()?.total }}</span>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <app-datatable
        [rows]="sb._entityName_.entities()"
        [columns]="columns"
        [headers]="headers"
        [rowHeight]="50"
        [count]="sb._entityName_.pagination()?.total"
        [offset]="getOffsetFromPagination()"
        [limit]="sb._entityName_.pagination()?.perPage"
        [selected]="selected"
        (selectChange)="onSelect($event)"
        (pageChange)="setPage($event)"
        (editClick)="onEdit($event)"
      ></app-datatable>
    </div>
  </div>
</div>
