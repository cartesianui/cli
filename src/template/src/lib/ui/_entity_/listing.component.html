<page-title [title]="'_Entity_'"></page-title>
<page-actions (search)="search()" (create)="showChildComponent(childComponents.createForm)"></page-actions>
<app-offcanvas id="_entity_-forms" [title]="childComponentSelected && childComponentSelected?.title" [visible]="childSelected" (visibleChange)="hideChildComponent($event)">
  <bo-create-_entity_-form *ngIf="isComponentSelected(childComponents.createForm)" (created)="onCreated()" ></bo-create-_entity_-form>
  <bo-edit-_entity_-form *ngIf="isComponentSelected(childComponents.editForm)"></bo-edit-_entity_-form>
</app-offcanvas>

<div class="animated fadeIn dt" #dtContainer>
  <div class="row">
    <div class="col-md-12 my-2">
      <span class="float-end">Total: {{ pagination.total }}</span>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <ngx-datatable
        class="material"
        [rows]="sb._entityName_Entities$ | async"
        [columns]="headers"
        [columnMode]="'force'"
        [headerHeight]="50"
        [footerHeight]="50"
        [rowHeight]="43"
        [externalPaging]="true"
        [count]="pagination.total"
        [offset]="getOffsetFromPagination()"
        [limit]="pagination.perPage"
        [selected]="selected"
        [selectionType]="'checkbox'"
        (select)="onSelect($event)"
        (page)="setPage($event)"
      >
        <ngx-datatable-column [width]="30" [sortable]="false" [canAutoResize]="false" [draggable]="false" [resizeable]="false" [headerCheckboxable]="true" [checkboxable]="true"></ngx-datatable-column>

        <ngx-datatable-column
          *ngFor="let col of columns"
          [name]="col.label"
          [prop]="col.key"
          [flexGrow]="1"
          [minWidth]="150"
        >
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span>{{ row[col.key] }}</span>
          </ng-template>
        </ngx-datatable-column>
        
      </ngx-datatable>
    </div>
  </div>
</div>
