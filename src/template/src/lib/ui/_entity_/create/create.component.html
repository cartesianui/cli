<div class="main-content" #formContainer>
  <form novalidate autocomplete="off" [formGroup]="formGroup">
    <div class="card">
      <div class="card-header">
        <span class="form-card-icon"><i class="fa fa-plus"></i></span>
        <div>
          <h1 class="form-card-title">Create _Entity_</h1>
          <div class="form-card-subtitle">Add a new _entity_ record</div>
        </div>
        <default-actions
          (save)="onSave()"
          [disabled]="{
            save: formGroup.invalid
          }"
        ></default-actions>
      </div>
      <div class="card-body">
        <!-- FORM PLACE HOLDER -->
      </div>
      <div class="card-footer">
        <default-actions
          (save)="onSave()"
          [disabled]="{
            save: formGroup.invalid
          }"
        ></default-actions>
      </div>
    </div>
  </form>
</div>
